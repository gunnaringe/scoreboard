name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go, Node, buf, the protoc plugins and prek, at the versions in mise.toml.
      - uses: jdx/mise-action@v5
      - name: prek hooks (YAML, JSON)
        run: prek run --all-files --show-diff-on-failure
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal gen web)"
          go vet ./...
      - name: Protobuf lint and generated code up to date
        run: |
          buf lint
          buf generate
          git diff --exit-code gen
      - name: Go tests
        run: go test -race ./...
      - name: Frontend tests
        run: |
          npm ci
          npm test
      - name: End-to-end smoke test
        run: make smoke
      - name: Browser end-to-end tests
        run: make e2e
